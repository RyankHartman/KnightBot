<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knight widget demo</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fafaf7;
      color: #1d1f23;
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px 200px; }
    h1 { font-size: 2.2rem; margin: 0 0 12px; }
    p { line-height: 1.6; color: #4a4f57; }
    code { background: #ececea; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>A sample website</h1>
    <p>This page shows how the Knight widget looks on someone else’s site. Click Knight in the bottom-right corner to open the chat.</p>
    <p>To add it to any site, paste this before the closing <code>&lt;/body&gt;</code> tag:</p>
    <p><code>&lt;script src="https://YOUR-KNIGHT-APP.vercel.app/widget.js" defer&gt;&lt;/script&gt;</code></p>
  </main>
  <script src="/widget.js" defer></script>
</body>
</html>
